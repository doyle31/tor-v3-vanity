[package]
name = "tor-v3-vanity"
version = "0.1.0"
authors = ["Aiden McClelland <me@drbonez.dev>"]
edition = "2021"
description = "A TOR v3 vanity url generator designed to run on an nvidia GPU."
license = "MIT"
repository = "https://github.com/dr-bonez/tor-v3-vanity"
documentation = "http://docs.rs/tor-v3-vanity"
readme = "README.md"
keywords = ["tor", "v3", "vanity", "gpu", "cuda"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "core/src/**/*", "core/Cargo.toml", "core/Cargo.lock", "build.rs", "README.md", "LICENSE"]

[[bin]]
name = "t3v"
# `test = true` so the unit tests in src/output.rs actually run; they were
# silently skipped while this was false, which made `cargo test` a no-op that
# reported success.
test = true
bench = false
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base32 = "0.5"
chrono = "0.4"
clap = "4"
crossbeam-channel = "0.5"
# The `hazmat` feature exposes `ExpandedSecretKey`, which is the only public
# way to turn an *expanded* key into a public key. 2.x's default surface takes a
# seed and SHA-512s it first, which is not what the kernel produces -- see the
# note at the derivation site in `main.rs`.
ed25519-dalek = { version = "2", features = ["hazmat"] }
anyhow = "1"
libc = "0.2"
rand = "0.9"
rustacuda = "0.1"
sha3 = "0.10"
tor-v3-vanity-core = { version = "0.1.0", path = "./core" }
