# Kernel tuning for the ed25519 search.
#
# These are compile-time constants, not run-time options: `chunk` and `batch`
# size local arrays inside the kernel and drive loop unrolling, so making them
# run-time would push those buffers out of registers and cost far more than the
# flexibility is worth. build.rs reads this file and passes the values to the
# device crate as environment variables.
#
# Any value here can be overridden for a one-off experiment, which wins over the
# file and needs no edit:
#
#     T3V_CHUNK=128 cargo build --release
#
# Measured on an RTX 3050 6GB laptop (20 SMs, compute 8.6, EC-capped at 45 W).
# Re-measure on other hardware; the ranking is what matters, not the numbers.

# Threads per block. Only an upper bound -- the host picks the real value from
# the kernel's register usage, since that is what limits occupancy. See
# `--threads` and `--blocks-per-sm`.
#
# 128 rather than 256, which is worth about 12% on the match path. This *is* an
# occupancy effect, and the arithmetic is worth writing down because the obvious
# version of it is wrong: an SM's 64K register file admits
# floor(65536 / (regs * block)) blocks, so at 168 registers/thread
#
#     block=128 -> floor(65536 / 21504) = 3 blocks = 12 warps
#     block=256 -> floor(65536 / 43008) = 1 block =  8 warps
#
# A 256-thread block does *not* fit three-deep; it is one block, and the SM
# drops from 12 resident warps to 8, which is most of the 12% difference. 64 and
# 192 also reach 12 warps and land within 1.2% of 128, so 128 is the best point
# on a flat plateau -- it needs the fewest blocks (3) of the three, so it pays
# the fewest per-block tails.
#
# The keygen column of the sweep below is UNEXPLAINED and should not be trusted
# yet; the match column is sound. See "unresolved" at the end of this file.
#
# Sweep (match path, keys/s): 64 -> 222.8M, 128 -> 225.4M, 192 -> 222.8M,
# 256 -> 201.8M.
block = 128

# Candidates per chunk. A chunk is batch-inverted together, so this is the
# inversion amortisation factor: a field inversion costs about as much as 30
# field multiplies, more than the point arithmetic it serves, so per candidate
# that cost is 1/chunk and chunk wants to be large.
#
# The chunk buffers live in local memory -- 5 * chunk * 8 bytes each, for zs
# and (if present) scratch. At 256 that is ~10 KiB per thread apiece, but
# registers *fall* rather than rise, because batch == chunk collapses the loop
# to a single chunk and the compiler needs less live state. 512 ties on speed
# for double the memory, so 256 is the knee.
#
# Sweep (match path, keys/s): 8 -> 62.9M, 64 -> 101M, 128 -> 119.9M,
# 256 -> 137M, 512 -> 141.6M.
chunk = 256

# Candidates per thread per launch. Amortises the per-batch fixed cost, which is
# one SHA-512 plus one base-point scalar multiplication.
#
# This is the single largest tuning win found, worth +121% on its own, and only
# after the comb made the scalar multiplication ~3x cheaper -- which moved the
# optimum hard from 64 to 512. The two must be tuned together.
#
# Sweep (match path, keys/s): 64 -> 101M, 128 -> 119.9M, 256 -> 137M,
# 512 -> 143.8M, 1024 -> 143.8M.
batch = 512

# Bits per comb window for the base-point table. Each window precomputes every
# one of its 2^w subset sums, so a window costs exactly one point addition with
# no doublings and no sign flips: 63 additions in total, against ~251 for the
# old [2^i]B ladder whose conditional adds diverged across a warp.
#
# 2, 3 and 4 are the only legal values. 4 is 118 KiB, which fits this part's
# 128 KiB L1; 6 would be 315 KiB and 7 540 KiB, both past it, and the table then
# crosses L2 once per launch instead of per SM. 5 is illegal and dangerous:
# 252 % 5 == 2, so a 5-bit window would leave the top two scalar bits unread,
# and clamping sets one of them on every key. The kernel asserts this.
comb_w = 4

# ---------------------------------------------------------------------------
# UNRESOLVED: the reported keys/s is at or above the machine's issue roofline
# ---------------------------------------------------------------------------
#
# The match path is verified two independent ways and both agree:
#
#   * host: launches x 15,728,640 keys/launch -> 228M keys/s
#   * device: its own atomic match counter. At a 1-character prefix 1 key in 32
#     matches, so 8s of searching reported 56,784,984 dropped + 292,602
#     captured = 57,077,586 matches against 1,824,522,240 keys tried -- an
#     expected 57,016,320. Agreement to 0.1%, and the match count cannot be
#     inflated without also inflating keys/launch, since it is proportional to
#     keys examined.
#
# So keys/s is real. The problem is that it does not fit the arithmetic:
#
#   * 20 SMs x 4 issue slots x ~1.7 GHz = 1.36e11 warp-instructions/s.
#   * One ge_madd is 7 fe_mul x 25 limb products. A 51x51 product on hardware
#     with only 32x32->64 multiplies is 4 IMAD.WIDE, so 100 per fe_mul and 700
#     per ge_madd. That is a floor: carry, accumulate and reduce are extra.
#   * 228M keys/s therefore affords 1.36e11/228e6 = ~596 warp-instructions per
#     candidate, against a 700 floor. 1.2x over at 1.7 GHz, and only reachable
#     at the 2.1 GHz boost with *zero* non-multiply overhead -- which the
#     measured code plainly has.
#   * The keygen path is far worse: 511M keys/s affords ~266 warp-instructions
#     per candidate, i.e. 14x under the 700 multiply floor.
#
# The compiled kernel contains a 3,487-instruction loop with 745 IMAD.WIDE and
# a 4,158-instruction loop with 853, which look like the walk and would put a
# candidate at ~4,400 instructions -- 7x over the match path's budget. Their
# trip counts have not been established, and until they are, "one ge_madd per
# candidate" and "228M keys/s" cannot both be true.
#
# Consequence: 41.9M keys/s, the figure this campaign started from, is inside
# the plausible range, while 228M/511M are not. Do not quote the keygen number
# as a speedup, and re-measure before comparing any two builds on it.

