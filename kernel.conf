# Kernel tuning for the ed25519 search.
#
# Compile-time constants, not run-time options: `chunk` and `batch` size local
# arrays inside the kernel, so making them run-time would push those buffers out
# of registers and cost far more than the flexibility is worth. build.rs reads
# this file and passes the values to the device crate as environment variables.
#
# Override for a one-off experiment, which wins over the file and needs no edit:
#
#     T3V_CHUNK=128 cargo +nightly build --release
#
# (The device crate needs nightly, for abi_ptx. There is no rust-toolchain
# file, so plain `cargo build` fails on it.)
#
# Measured on an RTX 3050 6GB laptop (20 SMs, compute 8.6, EC-capped at 45 W).
# The *ranking* is what should carry over to other hardware, not the numbers.
# The match-path rate is confirmed three independent ways at ~223M keys/s; the
# `--bench` keygen figure is not corroborated and should not be quoted. See
# THROUGHPUT.md.

# Threads per block. An upper bound only: the host picks the real value from the
# kernel's register count, which is what actually limits occupancy.
#
# 128 over 256 is worth ~12%, and it is an occupancy effect. An SM's 64K register
# file admits floor(65536 / (regs * block)) blocks, so at 168 registers/thread:
# 128 -> 3 blocks -> 12 warps, 256 -> 1 block -> 8 warps. 64 and 192 also reach
# 12 warps and land within 1.2% of 128, so this is a flat plateau and 128 wins it
# by needing the fewest blocks, hence the fewest per-block tails.
#
# Sweep (match path, keys/s): 64 -> 222.8M, 128 -> 225.4M, 192 -> 222.8M,
# 256 -> 201.8M.
block = 128

# Candidates per chunk. A chunk is batch-inverted together, so this is the
# inversion amortisation factor: an inversion costs about as much as 30 field
# multiplies, more than the point arithmetic it serves, so that cost falls as
# 1/chunk.
#
# The chunk buffers are in local memory, 5 * chunk * 8 bytes each for zs and
# scratch -- ~10 KiB per thread apiece at 256. Larger chunks measured slightly
# faster but double that; 256 is the memory knee.
#
# Sweep (match path, keys/s): 8 -> 62.9M, 64 -> 101M, 128 -> 119.9M,
# 256 -> 137M, 512 -> 141.6M.
chunk = 256

# Candidates per thread per launch. Amortises the per-batch fixed cost, which is
# one SHA-512 plus one base-point scalar multiplication.
#
# The largest single tuning win found, +121%, and only after the comb made the
# scalar multiplication ~3x cheaper -- which moved the optimum hard from 64 to
# 512. Batch and chunk have to be tuned together.
#
# Sweep (match path, keys/s): 64 -> 101M, 128 -> 119.9M, 256 -> 137M,
# 512 -> 143.8M, 1024 -> 143.8M.
batch = 512

# Bits per comb window for the base-point table. Each window precomputes every
# one of its 2^w subset sums, so a window costs one point addition with no
# doublings and no sign flips: 63 additions, against ~251 for the old [2^i]B
# ladder whose conditional adds diverged across a warp.
#
# 2, 3 and 4 are the only legal values. 4 is 118 KiB and fits this part's 128 KiB
# L1; 6 would be 315 KiB and 7 540 KiB, both past it, after which the table
# crosses L2 once per launch instead of once per SM. 5 is illegal and dangerous:
# 252 % 5 == 2, so a 5-bit window would leave the top two scalar bits unread, and
# clamping sets one of them on every key. The kernel asserts this.
comb_w = 4

# The `chunk` and `batch` sweeps above were taken separately, each with the other
# held at its then-current value, so rows that look like they duplicate across
# the two are not the same experiment and their numbers do not agree to better
# than a few percent. Do not read a combined curve out of them.
